<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020918">

  <title>指令终端</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23020918'/%3E%3Cpath d='M10 36c8-18 16 18 24 0s16 18 20 0' fill='none' stroke='%235fdcff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='18' r='5' fill='%23d7f7ff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #d8f8ff;
      --muted: #7294b5;
      --cyan: #5bdcff;
      --blue: #258cff;
      --deep: #071b43;
      --void: #01040b;
      --panel: rgba(3, 12, 29, .88);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--void);
      font-family: "IBM Plex Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: .18;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(130, 226, 255, .16) 4px);
      mix-blend-mode: screen;
    }

    #wavefield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .6;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100% - 36px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 34px 0 42px;
      display: grid;
      align-content: center;
      gap: 20px;
    }

    .masthead {
      text-align: center;
      user-select: none;
    }

    .logo-wrap {
      position: relative;
      width: clamp(108px, 16vw, 154px);
      aspect-ratio: 1;
      margin: 0 auto 8px;
      overflow: hidden;
      border-radius: 50%;
      border: 1px solid rgba(113, 218, 255, .28);
      box-shadow: 0 0 26px rgba(56, 181, 255, .22), inset 0 0 25px rgba(39, 140, 255, .1);
      background: #000;
    }

    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -20%;
      border: 1px solid rgba(91, 220, 255, .4);
      border-radius: 50%;
      animation: pulse 2.8s ease-out infinite;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none;
      opacity: 1;
    }

    .terminal {
      position: relative;
      height: 230px;
      padding: 25px 27px 28px;
      overflow: hidden;
      border: 1px solid rgba(96, 211, 255, .48);
      border-radius: 3px;
      background: var(--panel);
      box-shadow: 0 0 0 1px rgba(19, 102, 175, .22), 0 0 40px rgba(5, 93, 174, .2), inset 0 0 55px rgba(0, 82, 156, .08);
      clip-path: polygon(0 13px, 13px 0, calc(100% - 36px) 0, calc(100% - 27px) 9px, 100% 9px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 25px 100%, 16px calc(100% - 9px), 0 calc(100% - 9px));
      transition: height .72s cubic-bezier(.2, .8, .2, 1);
    }

    .terminal::before,
    .terminal::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .terminal::before {
      inset: 9px;
      border-top: 1px solid rgba(70, 178, 255, .15);
      border-bottom: 1px solid rgba(70, 178, 255, .1);
    }

    .terminal::after {
      top: -30%;
      left: 0;
      width: 100%;
      height: 24%;
      background: linear-gradient(transparent, rgba(90, 214, 255, .1), transparent);
      animation: scan 5.4s linear infinite;
    }

    #screen {
      position: relative;
      z-index: 1;
      padding-top: 22px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #a8efff;
      font-size: clamp(.94rem, 2.1vw, 1.08rem);
      line-height: 1.92;
      letter-spacing: .055em;
      text-shadow: 0 0 7px rgba(63, 208, 255, .62);
    }

    #screen.noise {
      color: #399acb;
      opacity: .76;
      word-break: break-all;
      animation: text-flicker .24s steps(2) infinite;
    }

    .field-value { color: #d9f9ff; }
    .unresolved {
      color: #287da9;
      opacity: .7;
      text-shadow: 0 0 7px rgba(36, 157, 218, .5);
    }
    .decoding-char {
      color: #fff;
      background: rgba(91, 220, 255, .22);
      text-shadow: 0 0 12px #7fe7ff;
    }
    .locked { animation: lock .28s ease-out; }
    .cursor { color: white; animation: blink .7s steps(1) infinite; }

    .controls {
      display: grid;
      justify-items: center;
    }

    button {
      position: relative;
      width: min(360px, 100%);
      min-height: 58px;
      padding: 0 32px;
      border: 1px solid #3aaeea;
      border-radius: 2px;
      color: #fff;
      background: #061d50;
      font: 600 1rem/1 inherit;
      letter-spacing: .28em;
      text-indent: .28em;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(22, 130, 230, .28), inset 0 0 17px rgba(52, 150, 255, .16);
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #0a2c70;
      box-shadow: 0 0 30px rgba(42, 167, 255, .48), inset 0 0 20px rgba(66, 169, 255, .22);
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    button:disabled { cursor: wait; color: #79a6bb; border-color: #275875; }

    @keyframes pulse {
      from { transform: scale(.68); opacity: .9; }
      to { transform: scale(1.35); opacity: 0; }
    }

    @keyframes scan {
      from { transform: translateY(0); }
      to { transform: translateY(680%); }
    }

    @keyframes blink { 50% { opacity: .25; } }

    @keyframes text-flicker {
      0%, 100% { opacity: .72; transform: translateX(0); }
      48% { opacity: .44; transform: translateX(1px); }
      52% { opacity: .9; transform: translateX(-1px); }
    }

    @keyframes lock {
      0% { color: white; background: rgba(91, 220, 255, .5); }
      100% { color: inherit; background: transparent; }
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 22px, 920px); padding: 20px 0 28px; gap: 15px; }
      .logo-wrap { width: 96px; }
      .terminal { height: 220px; padding: 20px 18px 22px; }
      #screen { padding-top: 18px; line-height: 1.75; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

      "手机电量首次变成{parity}时",
      "你再次坐下后的第{ordinal}分钟",
      "下一阵风碰到窗户之后",
      "今天第{ordinal}次听见自己的名字时",
      "任意一扇门连续开合{count}次后",
      "下一次洗手之前",
      "你发现一件遗忘已久的物品时",
      "屏幕亮度发生下一次变化后"
    ];

    const subjects = [
      "你左手边最近的一件无生命物品",
      "桌面上使用时间最久的东西",
      "距离你最近的一把椅子",
      "你今天最后触碰过的杯子",
      "一枚由你选定的硬币",
      "房间里最接近{color}的东西",
      "你自己的影子",
      "下一张由你亲手写下的纸条",
      "一只干燥且空置的容器",
      "离门最远的一只鞋",
      "目前离地面最近的一本书",
      "口袋里重量最轻的东西",
      "你最近删除的一张照片的标题",
      "身边第{ordinal}个带有直角的东西",
      "一段长度不足{centimeters}厘米的线",
      "此刻最安静的电子设备",
      "一把没有正在使用的伞",
      "今天见到的第{ordinal}种包装",
      "一件能够反光但不是镜子的东西",
      "房间内最低处的一张纸",
      "你能在{seconds}秒内找到的{shape}物体",
      "鞋底接触过的最后一块地面",
      "通讯录里名字最短的人",
      "窗边最容易被忽略的东西"
    ];

    const actions = [
      "将{target}{rotation}旋转{angle}度，再在旁边放下一张写有{parity}的纸",
      "向{target}陈述明天的天气，期间避开所有表示温度的词",
      "把{target}移到你认为第{ordinal}安静的位置，{minutes}分钟后恢复原位",
      "围绕{target}走{count}圈，把第{ordinal}次眨眼时所在的位置记下来",
      "让{target}与一件颜色完全不同的东西保持一支笔的距离",
      "敲击桌面{count}次，用能找到的最薄材料遮住{target}{breaths}个呼吸",
      "给{target}取一个{wordCount}字名字，在纸上写{count}遍后将纸折起",
      "把{target}放在高于膝盖而低于肩膀的位置，直到听见下一段音乐",
      "用不惯用手画出{target}的轮廓，将图纸倒置保存",
      "让{target}出现在某个反光表面中，随后背对它站立{seconds}秒",
      "在不改变用途的前提下，让{target}暂时朝向与你相反的方向",
      "对{target}说出一个能被{divisor}整除的数字，接着沉默{seconds}秒",
      "把{target}与今天见到的第{ordinal}个数字联系起来，写下一条并不存在的因果关系",
      "为{target}选择一个不存在的纪念日，把日期藏在一本书里",
      "在{target}旁边摆出一个无法闭合的{shape}，完成后拍手{count}次",
      "使{target}短暂地比任何{color}物品更靠近门，然后将它归还",
      "测量{target}到最近墙面的距离，用另一个毫不相关的数字替代测量结果",
      "把{target}交给右手，再交给左手，最后放到两只手都够不到的位置",
      "找出{target}最不显眼的一面，让它朝向房间中央",
      "在{target}附近留下{count}个大小不同的空白{shape}，擦掉其中最大的一个",
      "隔着一层布触碰{target}{count}次，每次间隔必须比上一次更短",
      "让{target}与一段正在播放的声音同时停止，失败时等待下一段声音",
      "用{wordCount}个字描述{target}，再删去其中最准确的{removeCount}个字",
      "把{target}放进一个临时划出的方形区域，只允许一个角越过边界",
      "将{target}指定为{color}，向空房间宣布{count}次",
      "使{target}经过{count}种不同高度，最后停在最不稳定的位置",
      "将{target}藏在仍能被直接看见的地方，假装寻找它{minutes}分钟",
      "把{target}与一件更轻的东西交换位置，但不要比较二者重量",
      "在{target}旁写下当前时间，故意把分钟增加{minuteOffset}",
      "让{target}朝向最近的出口，随后关闭一个与出口无关的开关"
    ];

    const constraints = [
      "期间不得说出它原本的名称",
      "全过程必须恰好改变{count}次方向",
      "若听见提示音，停下{seconds}秒再继续",
      "不要向旁人解释这样做的原因",
      "开始与结束时双脚须处于不同的地面区域",
      "结束以前不得大声说出数字 {forbiddenNumber}",
      "最后一次移动必须朝向{direction}",
      "全程只使用一只手，左右任选",
      "无法判断结果时，以影子的形状为准",
      "既定顺序不可调整，即使某一步毫无意义",
      "完成过程中至少有{count}次闭上双眼",
      "任何掉落到地面的东西都不得捡起",
      "中途只能回答{count}次别人提出的问题",
      "不得使用长度超过手掌的工具",
      "每做完一步都要向{side}看{count}次",
      "如果有人注视你，动作速度减半",
      "整个过程不能经过同一处位置{count}次",
      "结束后不要检查成果是否正确"
    ];

    const deadlines = [
      "开始后的{seconds}秒",
      "下一个整点",
      "分钟数字发生{count}次变化",
      "今日 {clock}",
      "你下一次离开当前房间",
      "开始后的{minutes}分{seconds}秒",
      "下一次收到消息通知",
      "室内任一光源再次改变状态",
      "本指令生成后的第{longSeconds}秒",
      "明日日落",
      "手机电量下降{percent}个百分点",
      "下一次有人开口叫你",
      "你再次经过一扇门",
      "当前播放的音乐结束",
      "今日最后一次看向窗外",
      "下一次整分钟到来"
    ];

    const colorWords = [
      "赤红色", "橙色", "琥珀色", "明黄色", "草绿色", "墨绿色",
      "青色", "天蓝色", "靛蓝色", "紫色", "品红色", "粉色",
      "棕色", "灰色", "银白色", "黑色"
    ];

    const directionWords = [
      "北方", "南方", "东方", "西方", "东北方", "西北方",
      "东南方", "西南方", "最近出口所在的方向", "你左手所指的方向",
      "与窗户相反的方向", "影子尖端所指的方向"
    ];

    const shapeWords = [
      "圆形", "三角形", "正方形", "五边形", "六边形", "椭圆形",
      "菱形", "月牙形", "螺旋形", "不对称十字形"
    ];

    const chineseNumbers = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
    const countNumbers = ["零", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
    const randomInt = (minimum, maximum) => minimum + Math.floor(Math.random() * (maximum - minimum + 1));
    const randomChinese = (minimum, maximum) => chineseNumbers[randomInt(minimum, maximum)];
    const randomClock = () => {
      const hour = String(randomInt(0, 23)).padStart(2, "0");
      let minute = randomInt(1, 58);
      if (minute === 15 || minute === 30 || minute === 45) minute += 2;
      return `${hour}:${String(minute).padStart(2, "0")}`;
    };
    const randomAngle = () => {
      let angle = randomInt(11, 349);
      while (angle % 15 === 0) angle = randomInt(11, 349);
      return angle;
    };

    const tokenFactories = {
      color: () => pickFresh(colorWords, "token-color", 7),
      direction: () => pickFresh(directionWords, "token-direction", 5),
      shape: () => pickFresh(shapeWords, "token-shape", 4),
      parity: () => Math.random() < 0.5 ? "奇数" : "偶数",
      rotation: () => Math.random() < 0.5 ? "顺时针" : "逆时针",
      side: () => Math.random() < 0.5 ? "左" : "右",
      clock: randomClock,
      clockNumber: () => randomInt(1, 12),
      ordinal: () => randomChinese(2, 9),
      count: () => countNumbers[randomInt(2, 9)],
      minutes: () => randomInt(2, 19),
      seconds: () => randomInt(7, 89),
      breaths: () => randomInt(5, 31),
      angle: randomAngle,
      divisor: () => randomInt(2, 12),
      centimeters: () => randomInt(4, 40),
      wordCount: () => randomInt(5, 12),
      removeCount: () => randomChinese(1, 3),
      minuteOffset: () => randomInt(1, 23),
      forbiddenNumber: () => randomInt(0, 99),
      longSeconds: () => randomInt(300, 3000),
      percent: () => randomInt(1, 19)
    };

    function resolveTokens(text) {
      return text.replace(/\{([a-zA-Z]+)\}/g, (match, key) => {
        const factory = tokenFactories[key];
        return factory ? factory() : match;
      });
    }

    const sentencePatterns = [
      (start, action, constraint, deadline) => `在${start}，${action}。${constraint}，并在${deadline}以前结束。`,
      (start, action, constraint, deadline) => `先等到${start}，随后${action}；${constraint}。不要拖过${deadline}。`,
      (start, action, constraint, deadline) => `等到${start}再行动。随后${action}，${constraint}；须赶在${deadline}以前收尾。`,
      (start, action, constraint, deadline) => `只有从${start}起，才可以${action}。${constraint}，${deadline}之后不再有效。`,
      (start, action, constraint, deadline) => `从${start}算起，${action}；${constraint}。最迟于${deadline}停手。`,
      (start, action, constraint, deadline) => `${action}，但不能早于${start}。${constraint}，最迟在${deadline}停止。`,
      (start, action, constraint, deadline) => `等到${start}，${action}。在${deadline}之前，${constraint}。`,
      (start, action, constraint, deadline) => `在${start}，便${action}；直到${deadline}为止，${constraint}。`,
      (start, action, constraint, deadline) => `不要立刻行动。在${start}，${action}，同时${constraint}；${deadline}以前必须停止。`,
      (start, action, constraint, deadline) => `从${start}开始执行：${action}。务必做到${constraint}，并于${deadline}之前结束。`,
      (start, action, constraint, deadline) => `等到${start}。之后${action}；只要尚未到${deadline}，就必须保证${constraint}。`,
      (start, action, constraint, deadline) => `在${start}，先${action}，再确保${constraint}。这一切不得晚于${deadline}。`
    ];

    const recentChoices = new Map();
    const recentPrescripts = [];

    function pickFresh(list, key, windowSize = 5) {
      const history = recentChoices.get(key) || [];
      let candidates = list.map((value, index) => ({ value, index }))
        .filter(item => !history.includes(item.index));
      if (!candidates.length) candidates = list.map((value, index) => ({ value, index }));
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      const limit = Math.min(windowSize, list.length - 1);
      recentChoices.set(key, [...history, chosen.index].slice(-limit));
      return chosen.value;
    }
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    function makeNoise(length = 430) {
      let value = "";
      for (let i = 0; i < length; i++) {
        value += glyphs[Math.floor(Math.random() * glyphs.length)];
        if ((i + 1) % 52 === 0) value += "\n";
      }
      return value;
    }

    function makeUnresolved(text, start = 0) {
      return Array.from(text.slice(start), character => {
        if (character === "\n" || character === " ") return character;
        return glyphs[Math.floor(Math.random() * glyphs.length)];
      }).join("");
    }

    function fitTerminal() {
      const verticalPadding = innerWidth <= 600 ? 58 : 68;
      const target = Math.max(innerWidth <= 600 ? 176 : 184, screen.scrollHeight + verticalPadding);
      terminal.style.height = `${target}px`;
    }

    function buildPrescript() {
      let prescript = "";
      for (let attempt = 0; attempt < 12; attempt++) {
        const start = pickFresh(beginnings, "beginning", 6);
        const target = pickFresh(subjects, "subject", 7);
        const action = pickFresh(actions, "action", 8).replaceAll("{target}", target);
        const constraint = pickFresh(constraints, "constraint", 6);
        const deadline = pickFresh(deadlines, "deadline", 6);
        const pattern = pickFresh(sentencePatterns, "pattern", 5);
        prescript = resolveTokens(pattern(start, action, constraint, deadline));
        if (!recentPrescripts.includes(prescript)) break;
      }
      recentPrescripts.push(prescript);
      if (recentPrescripts.length > 24) recentPrescripts.shift();
      return prescript;
    }

    function renderFinal(prescript) {
      screen.classList.remove("noise");
      screen.innerHTML = `<span class="field-value">${escapeHtml(prescript)}</span>`;
    }

    async function decode(prescript) {
      const plain = prescript;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        renderFinal(prescript);
        requestAnimationFrame(fitTerminal);
        return;
      }

      screen.classList.remove("noise");
      const locked = [];
      const delay = Math.max(11, Math.min(29, 2650 / plain.length));
      screen.innerHTML = `<span class="unresolved">${escapeHtml(makeUnresolved(plain))}</span>`;
      requestAnimationFrame(fitTerminal);
      await wait(320);
      for (let i = 0; i < plain.length; i++) {
        const target = plain[i];
        if (target === "\n" || target === " ") {
          locked.push(target);
          continue;
        }
        const scrambleCount = 2 + Math.floor(Math.random() * 4);
        for (let n = 0; n < scrambleCount; n++) {
          const current = glyphs[Math.floor(Math.random() * glyphs.length)];
          const remainder = makeUnresolved(plain, i + 1);
          screen.innerHTML = `<span class="field-value">${escapeHtml(locked.join(""))}</span><span class="decoding-char">${escapeHtml(current)}</span><span class="unresolved">${escapeHtml(remainder)}</span>`;
          await wait(delay);
        }
        locked.push(target);
        screen.innerHTML = `<span class="field-value">${escapeHtml(locked.join(""))}</span><span class="unresolved">${escapeHtml(makeUnresolved(plain, i + 1))}</span>`;
      }
      renderFinal(prescript);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character]);
    }

    async function receive() {
      if (decoding) return;
      decoding = true;
      button.disabled = true;
      button.textContent = "接收中";
      screen.classList.add("noise");
      screen.textContent = makeNoise(72);
      requestAnimationFrame(fitTerminal);
      await wait(760);
      const prescript = buildPrescript();
      await decode(prescript);
      button.textContent = "再次获取";
      button.disabled = false;
      decoding = false;
    }

    button.addEventListener("click", receive);
    screen.textContent = makeNoise(72);

    const canvas = document.querySelector("#wavefield");
    const ctx = canvas.getContext("2d");
    let width = 0;
    let height = 0;
    let dpr = 1;
    let time = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function wave(y, amplitude, frequency, speed, alpha) {
      ctx.beginPath();
      for (let x = -20; x <= width + 20; x += 8) {
        const pulse = Math.exp(-Math.pow((x - width * .5) / (width * .2), 2));
        const value = Math.sin(x * frequency + time * speed) * amplitude * (.18 + pulse);
        if (x === -20) ctx.moveTo(x, y + value);
        else ctx.lineTo(x, y + value);
      }
      ctx.strokeStyle = `rgba(45, 173, 255, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.shadowColor = "#27c8ff";
      ctx.shadowBlur = 8;
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.shadowBlur = 0;
      const halo = ctx.createRadialGradient(width / 2, height * .38, 0, width / 2, height * .38, Math.max(width, height) * .72);
      halo.addColorStop(0, "rgba(2, 54, 105, .28)");
      halo.addColorStop(1, "rgba(0, 4, 12, 0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);
      wave(height * .25, 44, .023, .034, .3);
      wave(height * .62, 68, .016, -.026, .2);
      wave(height * .84, 29, .031, .052, .16);
      time += 1;
      requestAnimationFrame(draw);
    }

    addEventListener("resize", () => {
      resize();
      fitTerminal();
    });
    resize();
    requestAnimationFrame(fitTerminal);
    draw();
  </script>
</body>
</html>
