<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020918">

  <title>指令终端</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23020918'/%3E%3Cpath d='M10 36c8-18 16 18 24 0s16 18 20 0' fill='none' stroke='%235fdcff' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='18' r='5' fill='%23d7f7ff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #d8f8ff;
      --muted: #7294b5;
      --cyan: #5bdcff;
      --blue: #258cff;
      --deep: #071b43;
      --void: #01040b;
      --panel: rgba(3, 12, 29, .88);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--void);
      font-family: "IBM Plex Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: .18;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(130, 226, 255, .16) 4px);
      mix-blend-mode: screen;
    }

    #wavefield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .6;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100% - 36px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 34px 0 42px;
      display: grid;
      align-content: center;
      gap: 20px;
    }

    .masthead {
      text-align: center;
      user-select: none;
    }

    .logo-wrap {
      position: relative;
      width: clamp(108px, 16vw, 154px);
      aspect-ratio: 1;
      margin: 0 auto 8px;
      overflow: hidden;
      border-radius: 50%;
      border: 1px solid rgba(113, 218, 255, .28);
      box-shadow: 0 0 26px rgba(56, 181, 255, .22), inset 0 0 25px rgba(39, 140, 255, .1);
      background: #000;
    }

    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -20%;
      border: 1px solid rgba(91, 220, 255, .4);
      border-radius: 50%;
      animation: pulse 2.8s ease-out infinite;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none;
      opacity: 1;
    }

    .terminal {
      position: relative;
      height: 230px;
      padding: 25px 27px 28px;
      overflow: hidden;
      border: 1px solid rgba(96, 211, 255, .48);
      border-radius: 3px;
      background: var(--panel);
      box-shadow: 0 0 0 1px rgba(19, 102, 175, .22), 0 0 40px rgba(5, 93, 174, .2), inset 0 0 55px rgba(0, 82, 156, .08);
      clip-path: polygon(0 13px, 13px 0, calc(100% - 36px) 0, calc(100% - 27px) 9px, 100% 9px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 25px 100%, 16px calc(100% - 9px), 0 calc(100% - 9px));
      transition: height .72s cubic-bezier(.2, .8, .2, 1);
    }

    .terminal::before,
    .terminal::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .terminal::before {
      inset: 9px;
      border-top: 1px solid rgba(70, 178, 255, .15);
      border-bottom: 1px solid rgba(70, 178, 255, .1);
    }

    .terminal::after {
      top: -30%;
      left: 0;
      width: 100%;
      height: 24%;
      background: linear-gradient(transparent, rgba(90, 214, 255, .1), transparent);
      animation: scan 5.4s linear infinite;
    }

    #screen {
      position: relative;
      z-index: 1;
      padding-top: 22px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #a8efff;
      font-size: clamp(.94rem, 2.1vw, 1.08rem);
      line-height: 1.92;
      letter-spacing: .055em;
      text-shadow: 0 0 7px rgba(63, 208, 255, .62);
    }

    #screen.noise {
      color: #399acb;
      opacity: .76;
      word-break: break-all;
      animation: text-flicker .24s steps(2) infinite;
    }

    .field-value { color: #d9f9ff; }
    .unresolved {
      color: #287da9;
      opacity: .7;
      text-shadow: 0 0 7px rgba(36, 157, 218, .5);
    }
    .decoding-char {
      color: #fff;
      background: rgba(91, 220, 255, .22);
      text-shadow: 0 0 12px #7fe7ff;
    }
    .locked { animation: lock .28s ease-out; }
    .cursor { color: white; animation: blink .7s steps(1) infinite; }

    .controls {
      display: grid;
      justify-items: center;
    }

    button {
      position: relative;
      width: min(360px, 100%);
      min-height: 58px;
      padding: 0 32px;
      border: 1px solid #3aaeea;
      border-radius: 2px;
      color: #fff;
      background: #061d50;
      font: 600 1rem/1 inherit;
      letter-spacing: .28em;
      text-indent: .28em;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(22, 130, 230, .28), inset 0 0 17px rgba(52, 150, 255, .16);
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #0a2c70;
      box-shadow: 0 0 30px rgba(42, 167, 255, .48), inset 0 0 20px rgba(66, 169, 255, .22);
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    button:disabled { cursor: wait; color: #79a6bb; border-color: #275875; }

    @keyframes pulse {
      from { transform: scale(.68); opacity: .9; }
      to { transform: scale(1.35); opacity: 0; }
    }

    @keyframes scan {
      from { transform: translateY(0); }
      to { transform: translateY(680%); }
    }

    @keyframes blink { 50% { opacity: .25; } }

    @keyframes text-flicker {
      0%, 100% { opacity: .72; transform: translateX(0); }
      48% { opacity: .44; transform: translateX(1px); }
      52% { opacity: .9; transform: translateX(-1px); }
    }

    @keyframes lock {
      0% { color: white; background: rgba(91, 220, 255, .5); }
      100% { color: inherit; background: transparent; }
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 22px, 920px); padding: 20px 0 28px; gap: 15px; }
      .logo-wrap { width: 96px; }
      .terminal { height: 220px; padding: 20px 18px 22px; }
      #screen { padding-top: 18px; line-height: 1.75; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

VVVVVVV";

    const receiveBeepAudio = new Audio(receiveBeepData);
    const decodeBeepAudio = new Audio(decodeBeepData);

    receiveBeepAudio.preload = "auto";
    decodeBeepAudio.preload = "auto";
    receiveBeepAudio.volume = 0.72;
    decodeBeepAudio.volume = 0.32;
    decodeBeepAudio.loop = true;

    function playReceiveBeep() {
      receiveBeepAudio.pause();
      receiveBeepAudio.currentTime = 0;
      receiveBeepAudio.play().catch(() => {});
    }

    function startDecodeBeep() {
      decodeBeepAudio.pause();
      decodeBeepAudio.currentTime = 0;
      decodeBeepAudio.play().catch(() => {});
    }

    function stopDecodeBeep() {
      decodeBeepAudio.pause();
      decodeBeepAudio.currentTime = 0;
    }

    function makeNoise(length = 430) {
      let value = "";
      for (let i = 0; i < length; i++) {
        value += glyphs[Math.floor(Math.random() * glyphs.length)];
        if ((i + 1) % 52 === 0) value += "\n";
      }
      return value;
    }

    function makeUnresolved(text, start = 0) {
      return Array.from(text.slice(start), character => {
        if (character === "\n" || character === " ") return character;
        return glyphs[Math.floor(Math.random() * glyphs.length)];
      }).join("");
    }

    function fitTerminal() {
      const verticalPadding = innerWidth <= 600 ? 58 : 68;
      const target = Math.max(innerWidth <= 600 ? 176 : 184, screen.scrollHeight + verticalPadding);
      terminal.style.height = `${target}px`;
    }

    function buildPrescript() {
      let prescript = "";
      for (let attempt = 0; attempt < 12; attempt++) {
        const start = pickFresh(beginnings, "beginning", 6);
        const target = pickFresh(subjects, "subject", 7);
        const action = pickFresh(actions, "action", 8).replaceAll("{target}", target);
        const constraint = pickFresh(constraints, "constraint", 6);
        const deadline = pickFresh(deadlines, "deadline", 6);
        const pattern = pickFresh(sentencePatterns, "pattern", 5);
        prescript = resolveTokens(pattern(start, action, constraint, deadline));
        if (!recentPrescripts.includes(prescript)) break;
      }
      recentPrescripts.push(prescript);
      if (recentPrescripts.length > 24) recentPrescripts.shift();
      return prescript;
    }

    function renderFinal(prescript) {
      screen.classList.remove("noise");
      screen.innerHTML = `<span class="field-value">${escapeHtml(prescript)}</span>`;
    }

    async function decode(prescript) {
      const plain = prescript;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        renderFinal(prescript);
        requestAnimationFrame(fitTerminal);
        return;
      }

      screen.classList.remove("noise");
      const locked = [];
      const delay = Math.max(11, Math.min(29, 2650 / plain.length));
      screen.innerHTML = `<span class="unresolved">${escapeHtml(makeUnresolved(plain))}</span>`;
      requestAnimationFrame(fitTerminal);
      await wait(320);
      startDecodeBeep();
      for (let i = 0; i < plain.length; i++) {
        const target = plain[i];
        if (target === "\n" || target === " ") {
          locked.push(target);
          continue;
        }
        const scrambleCount = 2 + Math.floor(Math.random() * 4);
        for (let n = 0; n < scrambleCount; n++) {
          const current = glyphs[Math.floor(Math.random() * glyphs.length)];
          const remainder = makeUnresolved(plain, i + 1);
          screen.innerHTML = `<span class="field-value">${escapeHtml(locked.join(""))}</span><span class="decoding-char">${escapeHtml(current)}</span><span class="unresolved">${escapeHtml(remainder)}</span>`;
          await wait(delay);
        }
        locked.push(target);
        screen.innerHTML = `<span class="field-value">${escapeHtml(locked.join(""))}</span><span class="unresolved">${escapeHtml(makeUnresolved(plain, i + 1))}</span>`;
      }
      stopDecodeBeep();
      renderFinal(prescript);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[character]);
    }

    async function receive() {
      if (decoding) return;
      decoding = true;
      button.disabled = true;
      button.textContent = "接收中";
      playReceiveBeep();
      screen.classList.add("noise");
      screen.textContent = makeNoise(72);
      requestAnimationFrame(fitTerminal);
      await wait(760);
      const prescript = buildPrescript();
      await decode(prescript);
      button.textContent = "再次获取";
      button.disabled = false;
      decoding = false;
    }

    button.addEventListener("click", receive);
    screen.textContent = makeNoise(72);

    const canvas = document.querySelector("#wavefield");
    const ctx = canvas.getContext("2d");
    let width = 0;
    let height = 0;
    let dpr = 1;
    let time = 0;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function wave(y, amplitude, frequency, speed, alpha) {
      ctx.beginPath();
      for (let x = -20; x <= width + 20; x += 8) {
        const pulse = Math.exp(-Math.pow((x - width * .5) / (width * .2), 2));
        const value = Math.sin(x * frequency + time * speed) * amplitude * (.18 + pulse);
        if (x === -20) ctx.moveTo(x, y + value);
        else ctx.lineTo(x, y + value);
      }
      ctx.strokeStyle = `rgba(45, 173, 255, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.shadowColor = "#27c8ff";
      ctx.shadowBlur = 8;
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.shadowBlur = 0;
      const halo = ctx.createRadialGradient(width / 2, height * .38, 0, width / 2, height * .38, Math.max(width, height) * .72);
      halo.addColorStop(0, "rgba(2, 54, 105, .28)");
      halo.addColorStop(1, "rgba(0, 4, 12, 0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);
      wave(height * .25, 44, .023, .034, .3);
      wave(height * .62, 68, .016, -.026, .2);
      wave(height * .84, 29, .031, .052, .16);
      time += 1;
      requestAnimationFrame(draw);
    }

    addEventListener("resize", () => {
      resize();
      fitTerminal();
    });
    resize();
    requestAnimationFrame(fitTerminal);
    draw();
  </script>
